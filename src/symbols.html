<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Classic Black Jack — szimbólumok</title>
<style>
  :root {
    --glass-1: #0b1430;
    --glass-2: #1b2a55;
    --rim-cream: #f6e2b4;
    --rim-gold: #e0a23c;
    --rim-dark: #8a5a17;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 64px;
    background: radial-gradient(ellipse at 50% 30%, var(--glass-2), var(--glass-1) 70%);
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #f4e9d2;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin: 0 0 28px;
    color: #f3c969;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    max-width: 720px;
    margin: 0 auto;
  }
  .cell {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(243,201,105,.18);
    border-radius: 12px;
    padding: 12px 8px 8px;
    text-align: center;
  }
  .cell svg { width: 100%; height: auto; display: block; }
  .cap {
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #c9b68c;
  }
</style>
</head>
<body>
<h1>Classic Black Jack — szimbólumkészlet</h1>
<div class="grid">

  <div class="cell">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="gOrange" cx="38%" cy="32%" r="72%">
          <stop offset="0%" stop-color="#ffd76a"/>
          <stop offset="48%" stop-color="#ffab22"/>
          <stop offset="100%" stop-color="#e2700a"/>
        </radialGradient>
      </defs>
      <g>
        <ellipse cx="100" cy="106" rx="82" ry="72" fill="none" stroke="var(--rim-cream)" stroke-width="20"/>
        <ellipse cx="100" cy="106" rx="82" ry="72" fill="none" stroke="var(--rim-gold)" stroke-width="12"/>
        <ellipse cx="100" cy="106" rx="82" ry="72" fill="url(#gOrange)"/>
        <ellipse cx="74" cy="76" rx="34" ry="21" fill="#fff" opacity=".45" transform="rotate(-18 74 76)"/>
        <path d="M134 150c-14 10-38 14-60 8" fill="none" stroke="#c25c05" stroke-width="7" stroke-linecap="round" opacity=".55"/>
        <path d="M150 62c8-10 20-12 26-6 5 6 1 17-9 22-7 4-15 4-20 1z" fill="#e8a33c" stroke="#a96c16" stroke-width="5" stroke-linejoin="round"/>
      </g>
    </svg>
    <div class="cap">Narancs</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="gLemon" cx="36%" cy="30%" r="74%">
          <stop offset="0%" stop-color="#fbf07f"/>
          <stop offset="50%" stop-color="#ead83c"/>
          <stop offset="100%" stop-color="#b8a614"/>
        </radialGradient>
      </defs>
      <g transform="rotate(-8 100 104)">
        <path id="lemonPath" d="M28 104c0-30 32-54 72-54s72 24 72 54-32 54-72 54-72-24-72-54z"
              fill="none" stroke="var(--rim-cream)" stroke-width="20"/>
        <path d="M28 104c0-30 32-54 72-54s72 24 72 54-32 54-72 54-72-24-72-54z"
              fill="none" stroke="var(--rim-gold)" stroke-width="12"/>
        <path d="M28 104c0-30 32-54 72-54s72 24 72 54-32 54-72 54-72-24-72-54z" fill="url(#gLemon)"/>
        <path d="M24 104c-8 0-12-3-12-6s5-5 12-5" fill="#ead83c" stroke="#a89512" stroke-width="5" stroke-linejoin="round"/>
        <ellipse cx="76" cy="80" rx="30" ry="16" fill="#fff" opacity=".42" transform="rotate(-14 76 80)"/>
        <path d="M140 140c-18 8-46 8-64 1" fill="none" stroke="#9d8c0f" stroke-width="7" stroke-linecap="round" opacity=".5"/>
      </g>
    </svg>
    <div class="cap">Citrom</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="gPlum" cx="36%" cy="28%" r="76%">
          <stop offset="0%" stop-color="#6fa8dc"/>
          <stop offset="45%" stop-color="#2f6fb0"/>
          <stop offset="100%" stop-color="#15315c"/>
        </radialGradient>
      </defs>
      <g>
        <ellipse cx="100" cy="112" rx="72" ry="68" fill="none" stroke="var(--rim-cream)" stroke-width="20"/>
        <ellipse cx="100" cy="112" rx="72" ry="68" fill="none" stroke="var(--rim-gold)" stroke-width="12"/>
        <ellipse cx="100" cy="112" rx="72" ry="68" fill="url(#gPlum)"/>
        <path d="M100 48c0 26-4 44-10 60" fill="none" stroke="#0e2547" stroke-width="7" stroke-linecap="round" opacity=".5"/>
        <ellipse cx="72" cy="82" rx="26" ry="16" fill="#cfe6ff" opacity=".5" transform="rotate(-20 72 82)"/>
        <path d="M104 50c14-22 40-30 56-22-6 20-26 34-48 32z" fill="#5f9a3a" stroke="#2f5c17" stroke-width="5" stroke-linejoin="round"/>
      </g>
    </svg>
    <div class="cap">Szilva</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="gBerry" cx="34%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#ff6a62"/>
          <stop offset="55%" stop-color="#e8202a"/>
          <stop offset="100%" stop-color="#9d0d16"/>
        </radialGradient>
      </defs>
      <g>
        <path d="M44 96c-6-18 8-34 26-32 4-16 24-24 38-14 12-12 34-8 40 8 18-2 30 14 24 30 10 12 6 30-8 36-2 16-20 26-34 20-12 10-32 8-40-6-18 4-34-10-32-26z"
              fill="none" stroke="var(--rim-cream)" stroke-width="20" stroke-linejoin="round"/>
        <path d="M44 96c-6-18 8-34 26-32 4-16 24-24 38-14 12-12 34-8 40 8 18-2 30 14 24 30 10 12 6 30-8 36-2 16-20 26-34 20-12 10-32 8-40-6-18 4-34-10-32-26z"
              fill="none" stroke="var(--rim-gold)" stroke-width="12" stroke-linejoin="round"/>
        <path d="M44 96c-6-18 8-34 26-32 4-16 24-24 38-14 12-12 34-8 40 8 18-2 30 14 24 30 10 12 6 30-8 36-2 16-20 26-34 20-12 10-32 8-40-6-18 4-34-10-32-26z"
              fill="#c4121b"/>
        <g fill="url(#gBerry)" stroke="#8d0a12" stroke-width="3">
          <circle cx="72" cy="74" r="19"/><circle cx="110" cy="66" r="19"/><circle cx="145" cy="82" r="18"/>
          <circle cx="60" cy="110" r="19"/><circle cx="97" cy="102" r="20"/><circle cx="134" cy="114" r="19"/>
          <circle cx="80" cy="142" r="18"/><circle cx="118" cy="146" r="18"/>
        </g>
        <ellipse cx="66" cy="66" rx="9" ry="6" fill="#fff" opacity=".55" transform="rotate(-25 66 66)"/>
        <ellipse cx="104" cy="58" rx="9" ry="6" fill="#fff" opacity=".5" transform="rotate(-25 104 58)"/>
      </g>
    </svg>
    <div class="cap">Szőlő</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gRind" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5fa83f"/>
          <stop offset="100%" stop-color="#1f5716"/>
        </linearGradient>
      </defs>
      <g transform="rotate(-10 100 104)">
        <ellipse cx="100" cy="104" rx="80" ry="62" fill="none" stroke="var(--rim-cream)" stroke-width="20"/>
        <ellipse cx="100" cy="104" rx="80" ry="62" fill="none" stroke="var(--rim-gold)" stroke-width="12"/>
        <ellipse cx="100" cy="104" rx="80" ry="62" fill="url(#gRind)"/>
        <g stroke="#123a0d" stroke-width="9" fill="none" stroke-linecap="round" opacity=".85">
          <path d="M52 62c-6 26-4 48 6 66"/>
          <path d="M88 48c-8 34-8 74 2 108"/>
          <path d="M126 52c8 32 8 70-2 100"/>
          <path d="M156 70c8 24 8 44 2 62"/>
        </g>
        <ellipse cx="72" cy="72" rx="26" ry="13" fill="#eaffd8" opacity=".33" transform="rotate(-16 72 72)"/>
      </g>
    </svg>
    <div class="cap">Dinnye</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gBell" x1="0.2" y1="0" x2="0.9" y2="1">
          <stop offset="0%" stop-color="#ffe680"/>
          <stop offset="45%" stop-color="#f0bf2a"/>
          <stop offset="100%" stop-color="#a9790a"/>
        </linearGradient>
      </defs>
      <g>
        <path d="M100 30c-6 0-11 5-11 11 0 3 1 5 3 7-22 9-36 31-36 57v26c0 6-4 9-9 12-4 2-6 5-6 8 0 5 4 8 9 8h100c5 0 9-3 9-8 0-3-2-6-6-8-5-3-9-6-9-12v-26c0-26-14-48-36-57 2-2 3-4 3-7 0-6-5-11-11-11z"
              fill="none" stroke="var(--rim-cream)" stroke-width="20" stroke-linejoin="round"/>
        <path d="M100 30c-6 0-11 5-11 11 0 3 1 5 3 7-22 9-36 31-36 57v26c0 6-4 9-9 12-4 2-6 5-6 8 0 5 4 8 9 8h100c5 0 9-3 9-8 0-3-2-6-6-8-5-3-9-6-9-12v-26c0-26-14-48-36-57 2-2 3-4 3-7 0-6-5-11-11-11z"
              fill="none" stroke="var(--rim-gold)" stroke-width="12" stroke-linejoin="round"/>
        <path d="M100 30c-6 0-11 5-11 11 0 3 1 5 3 7-22 9-36 31-36 57v26c0 6-4 9-9 12-4 2-6 5-6 8 0 5 4 8 9 8h100c5 0 9-3 9-8 0-3-2-6-6-8-5-3-9-6-9-12v-26c0-26-14-48-36-57 2-2 3-4 3-7 0-6-5-11-11-11z"
              fill="url(#gBell)"/>
        <path d="M74 66c-10 12-16 28-16 44v26" fill="none" stroke="#fff8d0" stroke-width="10" stroke-linecap="round" opacity=".5"/>
        <path d="M62 148h76" stroke="#a9790a" stroke-width="7" stroke-linecap="round" opacity=".6"/>
        <ellipse cx="100" cy="176" rx="14" ry="12" fill="url(#gBell)" stroke="var(--rim-gold)" stroke-width="7"/>
      </g>
    </svg>
    <div class="cap">Csengő</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gBarPlate" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5a3b1c"/>
          <stop offset="100%" stop-color="#2d1c0b"/>
        </linearGradient>
      </defs>
      <g>
        <rect x="18" y="62" width="164" height="80" rx="10"
              fill="none" stroke="var(--rim-cream)" stroke-width="20"/>
        <rect x="18" y="62" width="164" height="80" rx="10"
              fill="none" stroke="var(--rim-gold)" stroke-width="12"/>
        <rect x="18" y="62" width="164" height="80" rx="10" fill="url(#gBarPlate)"/>
        <text x="100" y="118" text-anchor="middle"
              font-family="Arial Black, Arial, sans-serif" font-size="54" font-weight="900"
              letter-spacing="3" fill="#efe3c8" stroke="#1d1206" stroke-width="3" paint-order="stroke">BAR</text>
      </g>
    </svg>
    <div class="cap">Bar</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gTile" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#cfe0ea"/>
          <stop offset="100%" stop-color="#8ea6b6"/>
        </linearGradient>
        <linearGradient id="gJackRed" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e8313c"/>
          <stop offset="100%" stop-color="#9c121c"/>
        </linearGradient>
      </defs>
      <g>
        <g id="bjTiles">
          <g transform="translate(12 58)">
            <rect x="0"   y="4" width="36" height="40" rx="5" fill="url(#gTile)" stroke="#e0a23c" stroke-width="4"/>
            <rect x="35"  y="0" width="36" height="40" rx="5" fill="url(#gTile)" stroke="#e0a23c" stroke-width="4"/>
            <rect x="70"  y="2" width="36" height="40" rx="5" fill="url(#gTile)" stroke="#e0a23c" stroke-width="4"/>
            <rect x="105" y="0" width="36" height="40" rx="5" fill="url(#gTile)" stroke="#e0a23c" stroke-width="4"/>
            <rect x="140" y="4" width="36" height="40" rx="5" fill="url(#gTile)" stroke="#e0a23c" stroke-width="4"/>
          </g>
          <g transform="translate(32 110)">
            <rect x="0"   y="4" width="36" height="40" rx="5" fill="url(#gTile)" stroke="#e0a23c" stroke-width="4"/>
            <rect x="35"  y="0" width="36" height="40" rx="5" fill="url(#gTile)" stroke="#e0a23c" stroke-width="4"/>
            <rect x="70"  y="2" width="36" height="40" rx="5" fill="url(#gTile)" stroke="#e0a23c" stroke-width="4"/>
            <rect x="105" y="0" width="36" height="40" rx="5" fill="url(#gTile)" stroke="#e0a23c" stroke-width="4"/>
          </g>
        </g>
        <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="30"
           fill="url(#gJackRed)" stroke="#6d0a12" stroke-width="2" paint-order="stroke" text-anchor="middle">
          <text x="30"  y="94">B</text>
          <text x="65"  y="90">L</text>
          <text x="100" y="92">A</text>
          <text x="135" y="90">C</text>
          <text x="170" y="94">K</text>
          <text x="50"  y="146">J</text>
          <text x="85"  y="142">A</text>
          <text x="120" y="144">C</text>
          <text x="155" y="142">K</text>
        </g>
      </g>
    </svg>
    <div class="cap">Black Jack</div>
  </div>

</div>
</body>
</html>

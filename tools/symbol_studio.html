<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Symbol studio</title>
<style>
  body { background: #cdcab0; margin: 10px; font: 14px sans-serif; }
  canvas { background: transparent; margin: 6px; outline: 1px dashed #888; }
</style>
</head>
<body>
<!--
  Reel symbols redrawn as vectors, after the original machine (artwork/reel_glass_v3.png, artwork/top_glass_v6.png).
  Open this page to look at them; tools/export_symbols.js saves each canvas to game/assets/sprites/<name>.png.
  The cream "sticker" rim every symbol has on the glass is added in the game (ui.js), not here.
-->
<script>
const OUT = "#3e0d0a"; // dark outline, as on the other sprites

function ellipsePath(g, cx, cy, rx, ry, rot = 0) {
  g.beginPath(); g.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2);
}
function gloss(g, cx, cy, rx, ry, rot, a = 0.6) {
  g.save(); ellipsePath(g, cx, cy, rx, ry, rot);
  const gr = g.createRadialGradient(cx - rx * 0.3, cy - ry * 0.3, 1, cx, cy, Math.max(rx, ry));
  gr.addColorStop(0, `rgba(255,255,255,${a})`); gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.fill(); g.restore();
}

// ---- plum (as on the reels of the machine): almond-shaped, pointed to the left, dark wine-violet with a bluish bloom
function szilva(g, W, H) {
  const body = () => {
    g.beginPath();
    g.moveTo(55, 262);                                              // the (blunt) point on the left
    g.bezierCurveTo(85, 150, 250, 62, 440, 60);                     // flatter top
    g.bezierCurveTo(620, 58, 715, 150, 715, 265);                   // round right end
    g.bezierCurveTo(715, 385, 600, 455, 420, 455);
    g.bezierCurveTo(250, 455, 95, 385, 55, 262);
    g.closePath();
  };
  body();
  const gr = g.createRadialGradient(380, 250, 20, 380, 260, 380);
  gr.addColorStop(0, "#5a3a7e"); gr.addColorStop(0.45, "#4a1a4e"); gr.addColorStop(0.8, "#3a0c2c"); gr.addColorStop(1, "#24051a");
  g.fillStyle = gr; g.fill();
  g.save(); body(); g.clip();
  // the bluish bloom in the middle
  const bloom = g.createRadialGradient(390, 250, 10, 390, 250, 230);
  bloom.addColorStop(0, "rgba(130,150,215,0.55)"); bloom.addColorStop(0.6, "rgba(110,120,200,0.22)"); bloom.addColorStop(1, "rgba(110,120,200,0)");
  g.fillStyle = bloom; g.fillRect(0, 0, W, H);
  const sh = g.createLinearGradient(0, 250, 0, 460);
  sh.addColorStop(0, "rgba(20,0,20,0)"); sh.addColorStop(1, "rgba(20,0,20,0.5)");
  g.fillStyle = sh; g.fillRect(0, 0, W, H);
  g.restore();
  gloss(g, 300, 118, 120, 30, -0.12, 0.6);
  gloss(g, 470, 104, 26, 12, 0, 0.7);
  body(); g.lineWidth = 16; g.lineJoin = "round"; g.strokeStyle = OUT; g.stroke();
}

// ---- watermelon (as on the photo of the machine): a round striped melon, on its left a small tilted cut face
// with a thick white rind and red flesh, no seeds
function dinnye(g, W, H) {
  const bx = 400, by = 300, brx = 290, bry = 262;
  ellipsePath(g, bx, by, brx, bry);
  const gb = g.createRadialGradient(bx - 30, by - 130, 20, bx, by, 330);
  gb.addColorStop(0, "#6cc86e"); gb.addColorStop(0.5, "#2f9443"); gb.addColorStop(1, "#135c27");
  g.fillStyle = gb; g.fill();
  g.save(); ellipsePath(g, bx, by, brx, bry); g.clip();
  // dark stripes running from the cut face to the far pole
  g.lineCap = "round"; g.strokeStyle = "#0f5222"; g.lineWidth = 34;
  for (let k = -3; k <= 3; k++) {
    const f = k / 3.4;
    g.beginPath();
    for (let t = 0; t <= 1.001; t += 0.04) {
      const x = bx - brx * 0.95 + t * brx * 2.05;
      const y = by + f * bry * Math.sin(Math.PI * (0.12 + t * 0.88)) + Math.sin(t * 18 + k) * 8;
      t === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.stroke();
  }
  const sh = g.createLinearGradient(0, by - bry, 0, by + bry);
  sh.addColorStop(0, "rgba(255,255,255,0.12)"); sh.addColorStop(0.55, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(0,30,10,0.45)");
  g.fillStyle = sh; g.fillRect(0, 0, W, H);
  g.restore();
  gloss(g, 470, 120, 95, 34, -0.12, 0.55);
  ellipsePath(g, bx, by, brx, bry); g.lineWidth = 16; g.strokeStyle = OUT; g.stroke();

  // the cut face: thin green skin, thick white rind, red flesh
  const fx = 165, fy = 300, frx = 108, fry = 196, rot = 0.12;
  ellipsePath(g, fx, fy, frx, fry, rot); g.fillStyle = "#2f8a3a"; g.fill();
  ellipsePath(g, fx, fy, frx - 10, fry - 12, rot); g.fillStyle = "#f4f2e2"; g.fill();
  ellipsePath(g, fx + 4, fy, frx - 42, fry - 58, rot);
  const gf = g.createRadialGradient(fx - 15, fy - 50, 8, fx, fy, fry - 50);
  gf.addColorStop(0, "#ff6d5e"); gf.addColorStop(0.5, "#e82632"); gf.addColorStop(1, "#b10f1d");
  g.fillStyle = gf; g.fill();
  g.lineWidth = 4; g.strokeStyle = "rgba(140,20,20,0.55)"; g.stroke();
  gloss(g, fx - 12, fy - 70, 20, 44, rot, 0.5);
  ellipsePath(g, fx, fy, frx, fry, rot); g.lineWidth = 14; g.strokeStyle = OUT; g.stroke();
}

// ---- grapes (as on the Match Play wheel): a wide bunch of small red berries lying on its side,
// a curled stem at the top left and a golden-orange leaf behind at the top right
function szolo(g, W, H) {
  // leaf behind
  g.save(); g.translate(540, 120); g.rotate(0.35);
  g.beginPath();
  g.moveTo(-150, 30);
  g.bezierCurveTo(-120, -60, -20, -95, 40, -70); g.bezierCurveTo(110, -110, 190, -60, 170, 10);
  g.bezierCurveTo(120, 40, -40, 60, -150, 30); g.closePath();
  const lg = g.createLinearGradient(0, -100, 0, 50); lg.addColorStop(0, "#ffd36a"); lg.addColorStop(1, "#e0831e");
  g.fillStyle = lg; g.fill(); g.lineWidth = 12; g.lineJoin = "round"; g.strokeStyle = OUT; g.stroke();
  g.beginPath(); g.moveTo(-130, 25); g.quadraticCurveTo(30, -10, 160, 0); g.lineWidth = 5; g.strokeStyle = "#a8561a"; g.stroke();
  g.restore();
  // curled stem
  g.save(); g.lineCap = "round";
  g.beginPath(); g.moveTo(170, 150); g.bezierCurveTo(130, 90, 70, 80, 60, 120); g.bezierCurveTo(52, 150, 90, 160, 100, 135);
  g.lineWidth = 28; g.strokeStyle = OUT; g.stroke(); g.lineWidth = 15; g.strokeStyle = "#8a5a22"; g.stroke();
  g.restore();
  // berries: 4 rows, widest at the top, narrowing to the lower right; back rows first
  const rows = [
    { y: 175, x0: 160, n: 6 }, { y: 255, x0: 130, n: 6 }, { y: 335, x0: 175, n: 5 }, { y: 410, x0: 245, n: 4 }, { y: 478, x0: 330, n: 2 },
  ];
  const r = 50, dx = 92;
  for (const row of rows) for (let i = 0; i < row.n; i++) {
    const x = row.x0 + i * dx + (row.y % 2 ? 6 : 0), y = row.y + ((i * 37) % 3) * 4;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
    const gr = g.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
    gr.addColorStop(0, "#ff8080"); gr.addColorStop(0.5, "#e8182e"); gr.addColorStop(1, "#8a0a1e");
    g.fillStyle = gr; g.fill();
    g.lineWidth = 8; g.strokeStyle = OUT; g.stroke();
    gloss(g, x - r * 0.3, y - r * 0.38, r * 0.3, r * 0.17, -0.5, 0.85);
  }
}

// ---- cherries (as on the reels of the machine): three cherries huddled together side by side, wider than tall,
// with short stems and a small leaf at the top
function cseresznye(g, W, H) {
  const berries = [[170, 250, 115], [395, 238, 110], [282, 300, 122]]; // back left, back right, front
  const top = [285, 95];
  g.save(); g.lineCap = "round";
  for (const [x, y, r] of berries) {
    g.beginPath(); g.moveTo(x, y - r * 0.75); g.quadraticCurveTo((x + top[0]) / 2, top[1] + 30, top[0], top[1]);
    g.lineWidth = 24; g.strokeStyle = OUT; g.stroke();
    g.lineWidth = 12; g.strokeStyle = "#5c8a26"; g.stroke();
  }
  g.restore();
  g.save(); g.translate(top[0] + 4, top[1] + 4); g.rotate(-0.25);
  g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(35, -50, 105, -48, 125, -12); g.bezierCurveTo(90, 18, 35, 22, 0, 0); g.closePath();
  const lg = g.createLinearGradient(0, -50, 0, 20); lg.addColorStop(0, "#9fd85a"); lg.addColorStop(1, "#4a8f24");
  g.fillStyle = lg; g.fill(); g.lineWidth = 10; g.lineJoin = "round"; g.strokeStyle = OUT; g.stroke();
  g.restore();
  for (const [x, y, r] of berries) {
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
    const gr = g.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.08, x, y, r);
    gr.addColorStop(0, "#ff8a7a"); gr.addColorStop(0.45, "#ee1c2c"); gr.addColorStop(1, "#8e0716");
    g.fillStyle = gr; g.fill();
    g.lineWidth = 14; g.strokeStyle = OUT; g.stroke();
    gloss(g, x - r * 0.25, y - r * 0.42, r * 0.38, r * 0.22, -0.35, 0.95);
  }
}

// ================= retro set: flat print as on the 80s glass =================
// one flat colour, a hard-edged darker crescent at the lower right, a plain light streak at the top left,
// a thick dark outline; no gradients, no gloss
function flatShape(g, path, base, shade, dx = 26, dy = 30) {
  path(); g.fillStyle = shade; g.fill();
  g.save(); path(); g.clip(); g.translate(-dx, -dy); path(); g.fillStyle = base; g.fill(); g.restore();
}
function streak(g, pts, w, color = "#fff6e6") {
  g.save(); g.lineCap = "round"; g.lineJoin = "round"; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  if (pts.length === 3) g.quadraticCurveTo(pts[1][0], pts[1][1], pts[2][0], pts[2][1]); else g.lineTo(pts[1][0], pts[1][1]);
  g.lineWidth = w; g.strokeStyle = color; g.stroke(); g.restore();
}
function outline(g, path, w = 18) { path(); g.lineWidth = w; g.lineJoin = "round"; g.strokeStyle = "#2a0a08"; g.stroke(); }

function szilvaRetro(g) {
  const p = () => { g.beginPath(); g.moveTo(55, 262); g.bezierCurveTo(85, 150, 250, 62, 440, 60); g.bezierCurveTo(620, 58, 715, 150, 715, 265);
    g.bezierCurveTo(715, 385, 600, 455, 420, 455); g.bezierCurveTo(250, 455, 95, 385, 55, 262); g.closePath(); };
  flatShape(g, p, "#5a1c44", "#361026", 40, 44);
  // the backlit bluish middle, flat
  g.save(); p(); g.clip(); g.beginPath(); g.ellipse(390, 250, 215, 120, -0.05, 0, Math.PI * 2); g.fillStyle = "#5c4a7c"; g.fill(); g.restore();
  streak(g, [[190, 150], [300, 98], [430, 92]], 22, "#e8dcf0");
  outline(g, p);
}
function cseresznyeRetro(g) {
  const berries = [[175, 245, 118], [390, 235, 112], [285, 290, 122]], top = [290, 120];
  g.save(); g.lineCap = "round";
  for (const [x, y, r] of berries) {
    g.beginPath(); g.moveTo(x, y - r * 0.75); g.quadraticCurveTo((x + top[0]) / 2, top[1] + 30, top[0], top[1]);
    g.lineWidth = 26; g.strokeStyle = "#2a0a08"; g.stroke(); g.lineWidth = 12; g.strokeStyle = "#6a9a2a"; g.stroke();
  }
  g.restore();
  for (const [x, y, r] of berries) {
    const p = () => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); };
    flatShape(g, p, "#e8202c", "#a50e1c", r * 0.28, r * 0.3);
    streak(g, [[x - r * 0.55, y - r * 0.2], [x - r * 0.45, y - r * 0.6], [x - r * 0.05, y - r * 0.7]], r * 0.2);
    outline(g, p, 16);
  }
}
function dinnyeRetro(g) {
  const body = () => { g.beginPath(); g.ellipse(420, 300, 300, 190, 0, 0, Math.PI * 2); };
  flatShape(g, body, "#3c9a3c", "#226a26", 50, 40);
  g.save(); body(); g.clip(); g.lineWidth = 38; g.strokeStyle = "#1a5a1e"; g.lineCap = "round";
  for (let k = -3; k <= 3; k++) {
    g.beginPath(); g.moveTo(140, 300 + k * 44); g.bezierCurveTo(320, 300 + k * 62, 540, 300 + k * 62, 720, 300 + k * 28); g.stroke();
  }
  g.restore();
  streak(g, [[380, 150], [490, 128], [600, 150]], 22, "#d8f0c0");
  outline(g, body);
  const face = () => { g.beginPath(); g.ellipse(175, 300, 105, 170, 0.12, 0, Math.PI * 2); };
  face(); g.fillStyle = "#f4f0dc"; g.fill();
  const flesh = () => { g.beginPath(); g.ellipse(180, 300, 68, 124, 0.12, 0, Math.PI * 2); };
  flatShape(g, flesh, "#e02834", "#a8141e", 16, 20);
  outline(g, flesh, 6);
  outline(g, face, 16);
}
function szoloRetro(g) {
  const berries = [];
  const rows = [{ y: 150, x0: 175, n: 5 }, { y: 225, x0: 125, n: 6 }, { y: 300, x0: 150, n: 6 }, { y: 375, x0: 205, n: 5 }, { y: 445, x0: 290, n: 3 }];
  const r = 52, dx = 82;
  for (const row of rows) for (let i = 0; i < row.n; i++) berries.push([row.x0 + i * dx, row.y]);
  const blob = () => { g.beginPath(); for (const [x, y] of berries) { g.moveTo(x + r, y); g.arc(x, y, r, 0, Math.PI * 2); } };
  // short stem at the top left
  g.save(); g.lineCap = "round"; g.beginPath(); g.moveTo(190, 110); g.quadraticCurveTo(150, 60, 110, 70);
  g.lineWidth = 30; g.strokeStyle = "#2a0a08"; g.stroke(); g.lineWidth = 15; g.strokeStyle = "#8a5a22"; g.stroke(); g.restore();
  outline(g, blob, 30);
  for (const [x, y] of berries) {
    const p = () => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); };
    flatShape(g, p, "#e82a34", "#b3121f", 12, 14);
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.lineWidth = 5; g.strokeStyle = "#86101a"; g.stroke();
    g.beginPath(); g.ellipse(x - r * 0.3, y - r * 0.38, r * 0.2, r * 0.12, -0.5, 0, Math.PI * 2); g.fillStyle = "#fff0e6"; g.fill();
  }
}

const SYMBOLS = {
  szilva: { w: 760, h: 510, draw: szilva },
  dinnye: { w: 720, h: 600, draw: dinnye },
  szolo: { w: 760, h: 560, draw: szolo },
  cseresznye: { w: 580, h: 440, draw: cseresznye },
};
// ?retro shows (and exports) the flat 80s set instead
if (location.search.includes("retro")) Object.assign(SYMBOLS, {
  szilva: { w: 760, h: 510, draw: szilvaRetro },
  dinnye: { w: 760, h: 600, draw: dinnyeRetro },
  szolo: { w: 760, h: 560, draw: szoloRetro },
  cseresznye: { w: 580, h: 440, draw: cseresznyeRetro },
});
for (const [name, s] of Object.entries(SYMBOLS)) {
  const c = document.createElement("canvas");
  c.width = s.w; c.height = s.h; c.id = name; c.title = name;
  c.style.width = s.w / 2 + "px";
  document.body.appendChild(c);
  s.draw(c.getContext("2d"), s.w, s.h);
}
</script>
</body>
</html>
